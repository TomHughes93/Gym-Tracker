
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg-color: #f4f6f9; --card-bg: #ffffff; --primary-color: #0070f3; --success-color: #22c55e; --danger-color: #ef4444; --border-color: #e2e8f0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); padding: 15px; }
        header { background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .tab-menu { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .tab-btn.active { background: var(--primary-color); color: white; }
        .stats-panel { background: #0f172a; color: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .exercise-card { background: white; padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 10px; }
        .log-inputs { display: flex; gap: 10px; margin-top: 10px; }
        input { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; }
        .btn-log { background: var(--success-color); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <select id="user-select" onchange="handleUserChange()" style="width:100%; padding:10px; margin-bottom:10px;">
        <option value="Ginge">Ginge</option>
        <option value="Swift">Swift</option>
    </select>
    <div class="tab-menu">
        <button class="tab-btn active" id="tab-track" onclick="switchTab('track')">Track</button>
        <button class="tab-btn" id="tab-metrics" onclick="switchTab('metrics')">Analytics</button>
    </div>
</header>

<div id="panel-track">
    <div class="stats-panel">
        <div>Volume: <span id="total-volume">0 kg</span></div>
        <button id="undo-btn" onclick="undoLastSetLocal()" style="margin-top:10px; background:none; color:white; border:1px solid white; cursor:pointer; padding:5px;">Undo Last Set</button>
    </div>
    <div id="muscle-picker" style="display:flex; flex-wrap:wrap; gap:5px; margin-bottom:15px;"></div>
    <div id="exercise-grid"></div>
    <button class="btn-log" style="width:100%; margin-top:20px; background:var(--danger-color);" onclick="endAndSyncSession()">Sync Session to Cloud</button>
</div>

<div id="panel-metrics" class="hidden">
    <div id="charts-wrapper-layout" style="background:white; padding:15px; border-radius:12px;"></div>
</div>

<div style="margin-top:30px; padding:15px; border:1px dashed #ccc; border-radius:12px;">
    <input type="email" id="auth-email" placeholder="Email" style="margin-bottom:5px;">
    <input type="password" id="auth-password" placeholder="Password" style="margin-bottom:5px;">
    <button onclick="handleLogin()" style="width:100%;">Login to Sync</button>
    <button onclick="handleLogout()" style="width:100%; margin-top:5px;">Logout</button>
</div>

<script>
    const supabaseClient = window.supabase.createClient('https://jxfqbycnvcvtmmfgprqr.supabase.co', 'sb_publishable_djfFpwP4wKpBgHg3XYCApg_cHSaKvA5');
    const exercises = [
        { id: "mach_lat_pull_down", exercise: "Lat Pull Down (Plate Loaded)", muscle_group: "Back" },
        { id: "bar_lat_pull_down", exercise: "Lat Pull Down (Straight Bar)", muscle_group: "Back" },
        { id: "rev_lat_pull_down", exercise: "Lat Pull Down (Reverse Grip)", muscle_group: "Back" },
        { id: "rope_lat_pull_over", exercise: "Lat Pull Over (Rope)", muscle_group: "Back" },
        { id: "bar_lat_pull_over", exercise: "Lat Pull Over (Straight Bar)", muscle_group: "Back" },
        { id: "3", exercise: "Cable Row (Narrow)", muscle_group: "Back" },
        { id: "4", exercise: "Cable Row (Wide)", muscle_group: "Back" },
        { id: "9", exercise: "Row (Machine - Narrow)", muscle_group: "Back" },
        { id: "10", exercise: "Row (Machine - Wide)", muscle_group: "Back" },
        { id: "5", exercise: "Plate Divergent Row (Narrow)", muscle_group: "Back" },
        { id: "6", exercise: "T-Bar Row (Narrow)", muscle_group: "Back" },
        { id: "7", exercise: "T-Bar Row (Wide)", muscle_group: "Back" },
        { id: "8", exercise: "Pull Ups (Weighted)", muscle_group: "Back" },
        { id: "mach_preacher_curl", exercise: "Preacher Curl (Machine)", muscle_group: "Biceps" },
        { id: "11", exercise: "Preacher Curl (Plate Loaded)", muscle_group: "Biceps" },
        { id: "cable_hammer_curl", exercise: "Cable Hammer Curl", muscle_group: "Biceps" },
        { id: "bayesian_curl", exercise: "Bayesian Curl", muscle_group: "Biceps" },
        { id: "13", exercise: "Seated Dumbbell Curl", muscle_group: "Biceps" },
        { id: "14", exercise: "Standing Bar Curl", muscle_group: "Biceps" },
        { id: "16", exercise: "Cable Bar Curl", muscle_group: "Biceps" },
        { id: "mach_flat_bench", exercise: "Flat Bench Press (Machine)", muscle_group: "Chest" },
        { id: "18", exercise: "Flat Bench Press (Barbell)", muscle_group: "Chest" },
        { id: "21", exercise: "Flat Bench Press (Smith Machine)", muscle_group: "Chest" },
        { id: "22", exercise: "Flat Bench Press (Dumbbell)", muscle_group: "Chest" },
        { id: "20", exercise: "Flat Bench Hunt (Plate Loaded)", muscle_group: "Chest" },
        { id: "23", exercise: "Incline Bench Press (Barbell)", muscle_group: "Chest" },
        { id: "26", exercise: "Incline Bench Press (Smith Machine)", muscle_group: "Chest" },
        { id: "27", exercise: "Incline Bench Press (Dumbbell)", muscle_group: "Chest" },
        { id: "25", exercise: "Incline Bench Press (Plate Loaded)", muscle_group: "Chest" },
        { id: "28", exercise: "Decline Bench Press (Plate Loaded)", muscle_group: "Chest" },
        { id: "29", exercise: "Pec Dec", muscle_group: "Chest" },
        { id: "30", exercise: "Cable Flys (High to Low)", muscle_group: "Chest" },
        { id: "31", exercise: "Cable Flys (Low to High)", muscle_group: "Chest" },
        { id: "32", exercise: "Dips (Weighted)", muscle_group: "Chest" },
        { id: "single_handle_tricep", exercise: "Single Handle Tricep Pushdown", muscle_group: "Triceps" },
        { id: "35", exercise: "Rope Extension", muscle_group: "Triceps" },
        { id: "37", exercise: "Bar Pull Down", muscle_group: "Triceps" },
        { id: "40", exercise: "V-Bar Push Down", muscle_group: "Triceps" },
        { id: "34", exercise: "Extension Machine", muscle_group: "Triceps" },
        { id: "39", exercise: "Overhead Extension", muscle_group: "Triceps" },
        { id: "38", exercise: "Skull Crushers", muscle_group: "Triceps" },
        { id: "33", exercise: "Cross Cable Flys", muscle_group: "Triceps" },
        { id: "mach_oh_press", exercise: "Shoulder Press (Machine)", muscle_group: "Shoulders" },
        { id: "41", exercise: "Overhead Press (Smith Machine)", muscle_group: "Shoulders" },
        { id: "42", exercise: "Overhead Press (Dumbbell)", muscle_group: "Shoulders" },
        { id: "43", exercise: "Overhead Press (Plate Loaded)", muscle_group: "Shoulders" },
        { id: "46", exercise: "Lateral Raise (Machine)", muscle_group: "Shoulders" },
        { id: "45", exercise: "Lateral Raise (Cable)", muscle_group: "Shoulders" },
        { id: "47", exercise: "Lateral Raise (Dumbbell)", muscle_group: "Shoulders" },
        { id: "single_rear_delt_fly", exercise: "Single Rear Delt Fly", muscle_group: "Shoulders" },
        { id: "51", exercise: "Rear Delt Fly (Machine)", muscle_group: "Shoulders" },
        { id: "50", exercise: "Rear Delt Fly (Cable)", muscle_group: "Shoulders" },
        { id: "48", exercise: "Front Raise (Plate)", muscle_group: "Shoulders" },
        { id: "49", exercise: "Front Raise (Cable)", muscle_group: "Shoulders" },
        { id: "52", exercise: "Barbell Shrugs", muscle_group: "Shoulders" },
        { id: "55", exercise: "Quad Extension (Plate Loaded)", muscle_group: "Legs" },
        { id: "56", exercise: "Quad Extension (Cable)", muscle_group: "Legs" },
        { id: "standing_hamstring_curl", exercise: "Standing Hamstring Curl", muscle_group: "Legs" },
        { id: "57", exercise: "Prone Hamstring Curl (Machine)", muscle_group: "Legs" },
        { id: "58", exercise: "Seated Hamstring Curl (Machine)", muscle_group: "Legs" },
        { id: "59", exercise: "Seated Hamstring Curl (Plate Loaded)", muscle_group: "Legs" },
        { id: "60", exercise: "Leg Press (Machine)", muscle_group: "Legs" },
        { id: "61", exercise: "Leg Press (Plate Loaded)", muscle_group: "Legs" },
        { id: "54", exercise: "Standing Calf Raise", muscle_group: "Legs" },
        { id: "53", exercise: "Seated Calf Raise (Plate Loaded)", muscle_group: "Legs" },
        { id: "62", exercise: "Treadmill", muscle_group: "Cardio" },
        { id: "63", exercise: "Spinning Bike", muscle_group: "Cardio" },
        { id: "64", exercise: "Seated Bike", muscle_group: "Cardio" }
    ];

    let activeAthlete = "Ginge";

    function getStorageKey() { return `gym_logs_${activeAthlete}`; }

    function updateUI() {
        const logs = JSON.parse(localStorage.getItem(getStorageKey()) || "[]");
        const activeGroups = Array.from(document.querySelectorAll('.muscle-chip:checked')).map(c => c.id);
        document.getElementById('exercise-grid').innerHTML = exercises
            .filter(ex => activeGroups.includes(ex.muscle_group))
            .map(ex => `
                <div class="exercise-card">
                    <div style="font-weight:600">${ex.exercise}</div>
                    <div class="log-inputs">
                        <input type="number" id="input-w-${ex.id}" placeholder="kg">
                        <input type="number" id="input-r-${ex.id}" placeholder="reps">
                        <button class="btn-log" onclick="logSetLocal('${ex.id}')">Log</button>
                    </div>
                </div>
            `).join('');
        const vol = logs.reduce((s, l) => s + (l.weight * l.reps), 0);
        document.getElementById('total-volume').textContent = `${vol} kg`;
    }

    function logSetLocal(id) {
        const w = parseFloat(document.getElementById(`input-w-${id}`).value);
        const r = parseInt(document.getElementById(`input-r-${id}`).value);
        if (isNaN(w) || w <= 0 || w > 500 || isNaN(r) || r <= 0) return alert('Invalid input.');
        const logs = JSON.parse(localStorage.getItem(getStorageKey()) || "[]");
        logs.push({ exercise_id: id, weight: w, reps: r });
        localStorage.setItem(getStorageKey(), JSON.stringify(logs));
        updateUI();
    }

    function undoLastSetLocal() {
        const logs = JSON.parse(localStorage.getItem(getStorageKey()) || "[]");
        logs.pop();
        localStorage.setItem(getStorageKey(), JSON.stringify(logs));
        updateUI();
    }

    async function endAndSyncSession() {
        const logs = JSON.parse(localStorage.getItem(getStorageKey()) || "[]");
        if (logs.length === 0) return alert("No logs.");
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) return alert("Login required.");
        try {
            const { data: s } = await supabaseClient.from('workout_sessions').insert([{ user_id: user.id }]).select().single();
            await supabaseClient.from('set_logs').insert(logs.map(l => ({ session_id: s.id, ...l })));
            localStorage.removeItem(getStorageKey());
            updateUI();
            alert("Sync complete.");
        } catch (e) { alert("Sync failed."); }
    }

    function switchTab(t) {
        document.getElementById('panel-track').classList.toggle('hidden', t !== 'track');
        document.getElementById('panel-metrics').classList.toggle('hidden', t !== 'metrics');
        document.getElementById('tab-track').classList.toggle('active', t === 'track');
        document.getElementById('tab-metrics').classList.toggle('active', t === 'metrics');
    }

    function handleLogin() { 
        supabaseClient.auth.signInWithPassword({ email: document.getElementById('auth-email').value, password: document.getElementById('auth-password').value })
            .then(({ error }) => { if (error) alert(error.message); else location.reload(); });
    }
    function handleLogout() { supabaseClient.auth.signOut().then(() => location.reload()); }
    function handleUserChange() { activeAthlete = document.getElementById("user-select").value; updateUI(); }
    window.onload = () => { 
        document.getElementById('muscle-picker').innerHTML = [...new Set(exercises.map(e => e.muscle_group))].map(g => `<input type="checkbox" id="${g}" class="muscle-chip" onchange="updateUI()" checked><label for="${g}" style="padding:5px 10px; background:#ddd; border-radius:15px; cursor:pointer;">${g}</label>`).join('');
        updateUI(); 
    };
</script>
</body>
</html>
