<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gym Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f9;padding:20px;}
.card{background:white;padding:15px;margin-bottom:15px;border-radius:10px;}
button{padding:10px;cursor:pointer;border:none;border-radius:6px;}
.logBtn{background:#22c55e;color:white;}
.active{background:#0070f3;color:white;}
.hidden{display:none;}
.exercise{border:1px solid #ddd;padding:10px;margin-bottom:10px;border-radius:10px;}
</style>
</head>
<body>

<div class="card">
<select id="userSelect">
<option>Ginge</option>
<option>Swift</option>
</select>
<button id="trackBtn" class="active">Track</button>
<button id="analyticsBtn">Analytics</button>
</div>

<div id="trackPanel">
<div class="card">
Volume: <span id="volume">0kg</span>
<button onclick="undoLast()">Undo</button>
</div>
<div class="card" id="muscles"></div>
<div id="exerciseContainer"></div>
<button onclick="syncSession()" style="width:100%;background:#ef4444;color:white;">Sync Session</button>
</div>

<div id="analyticsPanel" class="hidden">
<div class="card"><canvas id="analyticsChart"></canvas></div>
</div>

<div class="card">
<input id="email" placeholder="email">
<input id="password" type="password" placeholder="password">
<button onclick="login()">Login</button>
<button onclick="logout()">Logout</button>
</div>

<script>
const supabase = window.supabase.createClient(
"https://jxfqbycnvcvtmmfgprqr.supabase.co",
"sb_publishable_djfFpwP4wKpBgHg3XYCApg_cHSaKvA5"
);

const exercises = [
    {id:"mach_lat_pull_down", name:"Lat Pull Down (Plate Loaded)", group:"Back"},

    {id:"8", name:"Pull Ups (Weighted)", group:"Back"},
    {id:"mach_preacher_curl", name:"Preacher Curl (Machine)", group:"Biceps"},

    {id:"57", name:"Prone Hamstring Curl (Machine)", group:"Legs"},
    {id:"58", name:"Seated Hamstring Curl (Machine)", group:"Legs"},
    {id:"59", name:"Seated Hamstring Curl (Plate Loaded)", group:"Legs"},
    {id:"60", name:"Leg Press (Machine)", group:"Legs"},
    {id:"61", name:"Leg Press (Plate Loaded)", group:"Legs"},
    {id:"54", name:"Standing Calf Raise", group:"Legs"},
    {id:"53", name:"Seated Calf Raise (Plate Loaded)", group:"Legs"},
    {id:"62", name:"Treadmill", group:"Cardio"},
    {id:"63", name:"Spinning Bike", group:"Cardio"},
    {id:"64", name:"Seated Bike", group:"Cardio"}
];

let activeUser="Ginge";
function key(){ return `gym_${activeUser}`; }
function getLogs(){ return JSON.parse(localStorage.getItem(key())||"[]"); }
function saveLogs(data){ localStorage.setItem(key(), JSON.stringify(data)); }

function updateVolume(){
const total = getLogs().reduce((sum,x) => sum + (x.weight * x.reps), 0);
document.getElementById("volume").textContent = `${total}kg`;
}

function renderExercises(){
const selected = [...document.querySelectorAll(".muscleCheck:checked")].map(x => x.value);
const html = exercises.filter(x => selected.includes(x.group)).map(x => `
<div class="exercise">
<b>${x.name}</b>
<input id="w${x.id}" placeholder="kg" type="number">
<input id="r${x.id}" placeholder="reps" type="number">
<button class="logBtn" onclick="logSet('${x.id}')">Log</button>
</div>`).join("");
document.getElementById("exerciseContainer").innerHTML = html;
updateVolume();
}

function logSet(id){
const w = parseFloat(document.getElementById(`w${id}`).value);
const r = parseInt(document.getElementById(`r${id}`).value);
if(!w || !r || w < 0 || r < 0){ alert("Invalid values"); return; }
const ex = exercises.find(x => x.id === id);
const logs = getLogs();
logs.push({ exercise:id, exerciseName:ex.name, weight:w, reps:r, date:new Date() });
saveLogs(logs);
document.getElementById(`w${id}`).value = "";
document.getElementById(`r${id}`).value = "";
updateVolume();
}

function undoLast(){
const logs = getLogs();
if(logs.length === 0) return;
logs.pop();
saveLogs(logs);
updateVolume();
}

async function syncSession(){
const logs = getLogs();
if(!logs.length){ alert("No workout data"); return; }
const { data: { user } } = await supabase.auth.getUser();
if(!user){ alert("Please login"); return; }
const { error } = await supabase.from("set_logs").insert(logs.map(x => ({ user_id: user.id, ...x })));
if(error){ console.log(error); alert(error.message); return; }
localStorage.removeItem(key());
alert("Session synced");
updateVolume();
}

async function login(){
const email = document.getElementById("email").value;
const password = document.getElementById("password").value;
const { error } = await supabase.auth.signInWithPassword({ email, password });
if(error){ alert(error.message); return; }
alert("Logged in");
}

async function logout(){ await supabase.auth.signOut(); alert("Logged out"); }

document.getElementById("trackBtn").onclick = () => {
document.getElementById("trackPanel").classList.remove("hidden");
document.getElementById("analyticsPanel").classList.add("hidden");
};

document.getElementById("analyticsBtn").onclick = () => {
document.getElementById("trackPanel").classList.add("hidden");
document.getElementById("analyticsPanel").classList.remove("hidden");
};

document.getElementById("userSelect").onchange = (e) => {
activeUser = e.target.value;
renderExercises();
};

const groups = [...new Set(exercises.map(x => x.group))];
document.getElementById("muscles").innerHTML = groups.map(g => `
<label><input checked class="muscleCheck" value="${g}" type="checkbox" onchange="renderExercises()"> ${g}</label>`).join(" ");

renderExercises();
</script>
</body>
</html>
