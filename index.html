<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gym Analysis Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --success: #10b981; --danger: #ef4444; }
        body { background: var(--bg); color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 10px; }
        .container { max-width: 450px; margin: auto; }
        .card { background: var(--card); padding: 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #334155; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        input, select, button { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px; margin-top: 4px; }
        .btn-log { background: var(--success); font-weight: 900; }
        .btn-sync { background: var(--danger); font-weight: 900; }
        .hidden { display: none !important; }
        .tab-menu { display: flex; gap: 4px; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 10px; background: #334155; border: none; color: #94a3b8; }
        .tab-btn.active { background: var(--accent); color: var(--bg); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Gym Analysis</h2>
    <div class="card">
        <select id="userSelect" onchange="switchUser()">
            <option value="Ginge">Ginge</option>
            <option value="Swift">Swift</option>
        </select>
        <div id="vol-display" style="font-weight:800; color:var(--accent);">Volume: 0 kg</div>
    </div>

    <div class="tab-menu">
        <button class="tab-btn active" id="btn-track" onclick="toggleTab('track')">Track</button>
        <button class="tab-btn" id="btn-stats" onclick="toggleTab('stats')">Analytics</button>
    </div>

    <div id="track-panel">
        <select id="muscle-filter" onchange="render()">
            <option value="All">All Muscles</option>
            <option value="Back">Back</option>
            <option value="Biceps">Biceps</option>
            <option value="Chest">Chest</option>
            <option value="Triceps">Triceps</option>
            <option value="Shoulders">Shoulders</option>
            <option value="Legs">Legs</option>
            <option value="Cardio">Cardio</option>
        </select>
        <div id="exercise-list"></div>
        <button class="btn-sync" onclick="sync()">Sync to Cloud</button>
    </div>

    <div id="stats-panel" class="hidden">
        <div class="card">BI Analytics Placeholder</div>
    </div>
</div>

<script>
    const supabase = window.supabase.createClient("https://jxfqbycnvcvtmmfgprqr.supabase.co", "sb_publishable_djfFpwP4wKpBgHg3XYCApg_cHSaKvA5");
    
    const exercises = [
        {id: "mach_lat_pull_down", name: "Lat Pull Down (Plate Loaded)", group: "Back"},
        {id: "bar_lat_pull_down", name: "Lat Pull Down (Straight Bar)", group: "Back"},
        {id: "rev_lat_pull_down", name: "Lat Pull Down (Reverse Grip)", group: "Back"},
        {id: "rope_lat_pull_over", name: "Lat Pull Over (Rope)", group: "Back"},
        {id: "bar_lat_pull_over", name: "Lat Pull Over (Straight Bar)", group: "Back"},
        {id: "cable_row_narrow", name: "Cable Row (Narrow)", group: "Back"},
        {id: "cable_row_wide", name: "Cable Row (Wide)", group: "Back"},
        {id: "row_mach_narrow", name: "Row (Machine - Narrow)", group: "Back"},
        {id: "row_mach_wide", name: "Row (Machine - Wide)", group: "Back"},
        {id: "plate_row_narrow", name: "Plate Divergent Row (Narrow)", group: "Back"},
        {id: "tbar_row_narrow", name: "T-Bar Row (Narrow)", group: "Back"},
        {id: "tbar_row_wide", name: "T-Bar Row (Wide)", group: "Back"},
        {id: "pull_ups_weighted", name: "Pull Ups (Weighted)", group: "Back"},
        {id: "mach_preacher_curl", name: "Preacher Curl (Machine)", group: "Biceps"},
        {id: "preacher_plate", name: "Preacher Curl (Plate Loaded)", group: "Biceps"},
        {id: "cable_hammer_curl", name: "Cable Hammer Curl", group: "Biceps"},
        {id: "bayesian_curl", name: "Bayesian Curl", group: "Biceps"},
        {id: "seated_db_curl", name: "Seated Dumbbell Curl", group: "Biceps"},
        {id: "standing_bar_curl", name: "Standing Bar Curl", group: "Biceps"},
        {id: "cable_bar_curl", name: "Cable Bar Curl", group: "Biceps"},
        {id: "mach_flat_bench", name: "Flat Bench Press (Machine)", group: "Chest"},
        {id: "bench_barbell", name: "Flat Bench Press (Barbell)", group: "Chest"},
        {id: "bench_smith", name: "Flat Bench Press (Smith Machine)", group: "Chest"},
        {id: "bench_db", name: "Flat Bench Press (Dumbbell)", group: "Chest"},
        {id: "bench_plate", name: "Flat Bench Hunt (Plate Loaded)", group: "Chest"},
        {id: "incline_barbell", name: "Incline Bench Press (Barbell)", group: "Chest"},
        {id: "incline_smith", name: "Incline Bench Press (Smith Machine)", group: "Chest"},
        {id: "incline_db", name: "Incline Bench Press (Dumbbell)", group: "Chest"},
        {id: "incline_plate", name: "Incline Bench Press (Plate Loaded)", group: "Chest"},
        {id: "decline_plate", name: "Decline Bench Press (Plate Loaded)", group: "Chest"},
        {id: "pec_dec", name: "Pec Dec", group: "Chest"},
        {id: "cable_flys_hilo", name: "Cable Flys (High to Low)", group: "Chest"},
        {id: "cable_flys_lohi", name: "Cable Flys (Low to High)", group: "Chest"},
        {id: "dips_weighted", name: "Dips (Weighted)", group: "Chest"},
        {id: "tricep_pushdown", name: "Single Handle Tricep Pushdown", group: "Triceps"},
        {id: "rope_extension", name: "Rope Extension", group: "Triceps"},
        {id: "bar_pushdown", name: "Bar Pull Down", group: "Triceps"},
        {id: "vbar_pushdown", name: "V-Bar Push Down", group: "Triceps"},
        {id: "ext_machine", name: "Extension Machine", group: "Triceps"},
        {id: "overhead_ext", name: "Overhead Extension", group: "Triceps"},
        {id: "skull_crushers", name: "Skull Crushers", group: "Triceps"},
        {id: "cross_cable_fly", name: "Cross Cable Flys", group: "Triceps"},
        {id: "mach_oh_press", name: "Shoulder Press (Machine)", group: "Shoulders"},
        {id: "oh_press_smith", name: "Overhead Press (Smith Machine)", group: "Shoulders"},
        {id: "oh_press_db", name: "Overhead Press (Dumbbell)", group: "Shoulders"},
        {id: "oh_press_plate", name: "Overhead Press (Plate Loaded)", group: "Shoulders"},
        {id: "lat_raise_mach", name: "Lateral Raise (Machine)", group: "Shoulders"},
        {id: "lat_raise_cable", name: "Lateral Raise (Cable)", group: "Shoulders"},
        {id: "lat_raise_db", name: "Lateral Raise (Dumbbell)", group: "Shoulders"},
        {id: "rear_delt_fly", name: "Single Rear Delt Fly", group: "Shoulders"},
        {id: "rear_delt_mach", name: "Rear Delt Fly (Machine)", group: "Shoulders"},
        {id: "rear_delt_cable", name: "Rear Delt Fly (Cable)", group: "Shoulders"},
        {id: "front_raise_plate", name: "Front Raise (Plate)", group: "Shoulders"},
        {id: "front_raise_cable", name: "Front Raise (Cable)", group: "Shoulders"},
        {id: "shrugs", name: "Barbell Shrugs", group: "Shoulders"},
        {id: "quad_ext_plate", name: "Quad Extension (Plate Loaded)", group: "Legs"},
        {id: "quad_ext_cable", name: "Quad Extension (Cable)", group: "Legs"},
        {id: "stand_ham_curl", name: "Standing Hamstring Curl", group: "Legs"},
        {id: "prone_ham_curl", name: "Prone Hamstring Curl (Machine)", group: "Legs"},
        {id: "seated_ham_curl", name: "Seated Hamstring Curl (Machine)", group: "Legs"},
        {id: "seated_ham_plate", name: "Seated Hamstring Curl (Plate Loaded)", group: "Legs"},
        {id: "leg_press_mach", name: "Leg Press (Machine)", group: "Legs"},
        {id: "leg_press_plate", name: "Leg Press (Plate Loaded)", group: "Legs"},
        {id: "stand_calf", name: "Standing Calf Raise", group: "Legs"},
        {id: "seated_calf", name: "Seated Calf Raise (Plate Loaded)", group: "Legs"},
        {id: "treadmill", name: "Treadmill", group: "Cardio"},
        {id: "spin_bike", name: "Spinning Bike", group: "Cardio"},
        {id: "seated_bike", name: "Seated Bike", group: "Cardio"}
    ];

    let user = "Ginge";

    function getKey() { return `gym_data_${user}`; }

    function render() {
        const filter = document.getElementById('muscle-filter').value;
        const list = document.getElementById('exercise-list');
        list.innerHTML = exercises
            .filter(e => filter === 'All' || e.group === filter)
            .map(e => `
                <div class="card">
                    <div style="font-weight:700">${e.name}</div>
                    <div class="grid-2">
                        <input id="w-${e.id}" type="number" placeholder="kg">
                        <input id="r-${e.id}" type="number" placeholder="reps">
                    </div>
                    <button class="btn-log" onclick="log('${e.id}', '${e.name}')">Log Set</button>
                </div>
            `).join('');
        updateVol();
    }

    function log(id, name) {
        const w = document.getElementById(`w-${id}`).value;
        const r = document.getElementById(`r-${id}`).value;
        if(!w || !r) return;
        const logs = JSON.parse(localStorage.getItem(getKey()) || "[]");
        logs.push({ name, weight: w, reps: r, date: new Date() });
        localStorage.setItem(getKey(), JSON.stringify(logs));
        document.getElementById(`w-${id}`).value = "";
        document.getElementById(`r-${id}`).value = "";
        updateVol();
    }

    function updateVol() {
        const logs = JSON.parse(localStorage.getItem(getKey()) || "[]");
        const vol = logs.reduce((sum, l) => sum + (Number(l.weight) * Number(l.reps)), 0);
        document.getElementById('vol-display').innerText = `Volume: ${vol} kg`;
    }

    function switchUser() { user = document.getElementById('userSelect').value; render(); }

    function toggleTab(t) {
        document.getElementById('track-panel').classList.toggle('hidden', t !== 'track');
        document.getElementById('stats-panel').classList.toggle('hidden', t !== 'stats');
        document.getElementById('btn-track').classList.toggle('active', t === 'track');
        document.getElementById('btn-stats').classList.toggle('active', t === 'stats');
    }

    async function sync() {
        const logs = JSON.parse(localStorage.getItem(getKey()) || "[]");
        const { data: { user: authUser } } = await supabase.auth.getUser();
        if(!authUser) return alert("Login to sync.");
        
        const { error } = await supabase.from('gym_logs').insert(logs.map(l => ({ ...l, user_id: authUser.id })));
        if(error) alert(error.message);
        else { localStorage.setItem(getKey(), "[]"); updateVol(); alert("Synced!"); }
    }

    render();
</script>
</body>
</html>
